syntax = "proto3";

package selfhold.parley.v1;

option go_package = "github.com/SelfHold/parley/core/rpc/pb";

// Parley is served by the core, which runs inside the app's process on
// every platform (unix socket, tcp on localhost on Windows). The Flutter
// app and the parley CLI are clients. Every call carries "authorization: Bearer <token>".
//
// Ids: an account is identified by account_id (never by provider type:
// several accounts of one provider are normal). Chat and message ids are
// the provider's own ids and are unique only inside one account, so every
// call that names a chat or a message also names the account.
service Parley {
  // Vault lifecycle.
  rpc GetState(Empty) returns (State);
  rpc CreateVault(PasswordRequest) returns (State);
  rpc Unlock(PasswordRequest) returns (State);
  rpc LockVault(Empty) returns (State);
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
  // PermissionDenied unless the password opens the vault (e.g. before
  // saving it for fingerprint unlock).
  rpc CheckPassword(PasswordRequest) returns (Empty);
  // "Remember the password on this machine" (State.can_remember): the key
  // derived from the password goes to the OS keychain (Secret Service,
  // Windows Credential Manager), never the password itself.
  // RememberPassword checks the password (PermissionDenied) and keeps it;
  // UnlockRemembered opens the vault with it: NotFound when nothing is
  // kept, PermissionDenied (and forgotten) when the password has changed
  // elsewhere, Unavailable when the keychain does not answer. A password
  // change here keeps what is remembered up to date.
  rpc RememberPassword(PasswordRequest) returns (State);
  rpc ForgetPassword(Empty) returns (State);
  rpc UnlockRemembered(Empty) returns (State);
  // Where the vault file lives (desktops; kept across runs). move: the open
  // vault goes to path (FailedPrecondition while locked, AlreadyExists if a
  // file is there), a remembered password follows it. Otherwise path is an
  // existing vault to use from now on (FailedPrecondition while unlocked,
  // NotFound if there is no file). A directory means "vault.parley" in it.
  rpc SetVaultPath(VaultPathRequest) returns (State);

  // "Sync via Shard" (CONNECTOR.md): the vault file is kept in the
  // user's Shard vault and every device gets the same one. It works
  // only while Shard runs on this device (desktops: shardd; Android:
  // the Shard app) and the app stays usable without it. Changes come as
  // KIND_SHARD. EnableShard pairs this device (state PAIRING with a
  // code the user compares in Shard) and syncs; it works while unlocked
  // or when there is no vault yet (it then takes the synced one).
  // CONFLICT: the synced vault differs from this one, ResolveShard
  // picks. NEEDS_PASSWORD: the synced copy has another password,
  // ShardPassword gives it. DisableShard keeps the local vault.
  rpc Shard(Empty) returns (ShardState);
  rpc EnableShard(Empty) returns (ShardState);
  rpc CancelShardPairing(Empty) returns (ShardState);
  rpc ResolveShard(ResolveShardRequest) returns (ShardState);
  rpc ShardPassword(PasswordRequest) returns (ShardState);
  rpc DisableShard(DisableShardRequest) returns (ShardState);

  // Providers and accounts.
  rpc Providers(Empty) returns (ProvidersReply);
  // Sign-in is a short dialog driven by the core: StartLogin returns the
  // first step (fields to fill, a URL to open, ...), LoginStep answers it
  // and returns the next one, until a step is done and carries the new
  // account. CancelLogin drops an unfinished sign-in.
  rpc StartLogin(StartLoginRequest) returns (LoginStepReply);
  rpc LoginStep(LoginStepRequest) returns (LoginStepReply);
  rpc CancelLogin(IdRequest) returns (Empty);
  // Signs an existing account in again (its session expired); same dialog,
  // the result replaces the account's credentials and keeps its id.
  rpc Relogin(IdRequest) returns (LoginStepReply);
  rpc Accounts(Empty) returns (AccountsReply);
  rpc RenameAccount(RenameRequest) returns (Account);
  rpc SetAccountEnabled(SetEnabledRequest) returns (Account);
  // Signs out and forgets the account and its cached messages.
  rpc RemoveAccount(IdRequest) returns (Empty);
  // Puts the accounts in this order; accounts not listed follow, as they were.
  rpc ReorderAccounts(ReorderAccountsRequest) returns (AccountsReply);

  // Chats and messages.
  // All chats of the given accounts (all accounts when empty), newest
  // activity first. Served from the local cache; Refresh asks providers.
  rpc Chats(ChatsRequest) returns (ChatsReply);
  rpc RefreshChats(ChatsRequest) returns (Empty);
  // Messages of one chat, newest first, before before_id (latest when
  // empty). Missing ones are fetched from the provider and cached.
  rpc History(HistoryRequest) returns (HistoryReply);
  rpc Send(SendRequest) returns (Message);
  rpc Forward(ForwardRequest) returns (ForwardReply);
  rpc MarkRead(MarkReadRequest) returns (Empty);
  // Replies of a thread (Slack thread, Telegram channel comments), newest
  // first like History. Not cached; live replies come as
  // KIND_THREAD_MESSAGE.
  rpc Thread(ThreadRequest) returns (HistoryReply);
  // Topics of a forum chat (Chat.forum), pinned first. A topic's messages
  // are the thread with the topic's id: Thread, SendRequest.thread_id,
  // KIND_THREAD_MESSAGE; they are also in the chat's History. Not cached.
  rpc Topics(TopicsRequest) returns (TopicsReply);
  // Adds or takes back the account's reaction; returns the message with
  // its new reactions (a KIND_MESSAGE_EDIT follows).
  rpc React(ReactRequest) returns (Message);
  // Replaces the text of one of the account's own messages; returns the
  // message as it is now (a KIND_MESSAGE_EDIT follows). CAPABILITY_EDIT.
  rpc Edit(EditRequest) returns (Message);
  // Deletes the account's own messages of one chat for everyone
  // (CAPABILITY_DELETE) or only for this account (for_all false,
  // CAPABILITY_DELETE_FOR_ME); KIND_MESSAGE_DELETE (KIND_THREAD_MESSAGE
  // with deleted for thread replies) follows.
  rpc Delete(DeleteRequest) returns (Empty);
  // A link's preview from its page's Open Graph tags, fetched by the core
  // (public addresses only; cached in memory). NotFound: nothing to show.
  rpc LinkPreview(LinkPreviewRequest) returns (LinkPreviewReply);
  // People of a chat to mention, for the composer's "@" (CAPABILITY_MENTIONS).
  rpc Members(MembersRequest) returns (MembersReply);
  // Content of a media ref: an avatar (User/Chat.avatar_url) or an
  // attachment (Attachment.ref, .thumb). Cached in the core.
  rpc Media(MediaRequest) returns (MediaReply);
  // What a chat is: the person of a direct chat, a group or a channel
  // (CAPABILITY_PROFILES). Not cached.
  rpc Profile(ProfileRequest) returns (ChatProfile);
  // Mutes, pins, archives or leaves a chat (Account.chat_actions,
  // CAPABILITY_MANAGE_CHATS) and returns it as it is now; a KIND_CHAT (or,
  // after leaving, KIND_CHAT_REMOVED) follows. Leaving: groups and
  // channels only.
  rpc ManageChat(ManageChatRequest) returns (Chat);
  // Chat folders of the accounts (CAPABILITY_CHAT_FOLDERS: Telegram).
  // KIND_CHAT_FOLDERS tells they changed.
  rpc ChatFolders(AccountsRequest) returns (ChatFoldersReply);

  // 1:1 calls (CAPABILITY_CALLS). Media runs in the app as a standard
  // WebRTC peer connection: the core passes its offer, answer, candidates
  // and data-channel messages to the messenger (CallSignal) and back
  // (KIND_CALL_SIGNAL). KIND_CALL reports state changes.
  rpc StartCall(StartCallRequest) returns (Call);
  rpc AcceptCall(CallRequest) returns (Empty);
  rpc EndCall(EndCallRequest) returns (Empty);
  rpc CallSignal(CallSignalRequest) returns (Empty);
  rpc SetCallMedia(CallMediaRequest) returns (Empty);
  // Live calls (after a reconnect), and the signals of one call after a
  // seq (the ones a reconnect may have lost).
  rpc Calls(Empty) returns (CallsReply);
  rpc CallSignals(CallSignalsRequest) returns (CallSignalsReply);

  // Live events: new/edited/deleted messages, chat changes, account state,
  // vault state. The stream ends when the client goes away.
  // Mail (CAPABILITY_MAIL). Not cached: read from the providers, several
  // accounts at once, merged. Accounts that failed are listed in the reply;
  // the others still count. Attachments are media refs (Media).
  rpc Folders(AccountsRequest) returns (FoldersReply);
  // One page of the merged mail of several accounts (all inboxes, ...),
  // newest first.
  rpc MailList(MailListRequest) returns (MailListReply);
  // One message with its body; it is not marked read (UpdateMail READ).
  rpc GetMail(GetMailRequest) returns (Mail);
  rpc SendMail(SendMailRequest) returns (Empty);
  rpc UpdateMail(UpdateMailRequest) returns (Empty);
  // Moves messages of one account between its folders.
  rpc MoveMail(MoveMailRequest) returns (Empty);

  // Calendars (CAPABILITY_CALENDAR): all calendars of all accounts, and
  // their events of a time range merged by start.
  rpc Calendars(AccountsRequest) returns (CalendarsReply);
  rpc Events(EventsRequest) returns (EventsReply);
  rpc SaveEvent(CalendarEvent) returns (CalendarEvent);
  rpc DeleteEvent(DeleteEventRequest) returns (Empty);

  rpc Watch(Empty) returns (stream Event);

  // Recent core events (connection failures, sync errors).
  rpc Logs(LogsRequest) returns (LogsReply);
  rpc ClearLogs(Empty) returns (Empty);
}

message Empty {}

message IdRequest { string id = 1; }

message PasswordRequest { string password = 1; }

message VaultPathRequest {
  string path = 1; // absolute
  bool move = 2;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message State {
  bool vault_exists = 1;
  bool unlocked = 2;
  string vault_path = 3;
  string platform = 4; // linux, windows, android, ...
  string core_version = 5;
  string core_build = 6;
  int32 accounts = 7;
  int32 accounts_online = 8;
  reserved 9; // can_shutdown: there is no daemon to stop
  bool can_remember = 10; // this machine has a keychain (desktops)
  bool remembered = 11;   // the password is remembered: UnlockRemembered
  ShardState shard = 12;
}

message ShardState {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    OFF = 1;            // sync is off (enabled is false)
    NOT_RUNNING = 2;    // Shard is not installed or not running here
    NO_VAULT = 3;       // Shard is not set up
    LOCKED = 4;         // the user has to unlock Shard
    OFFLINE = 5;        // Shard has no storage yet: changes wait
    PAIRING = 6;        // waiting for the user to allow it: pairing_code
    SYNCING = 7;
    SYNCED = 8;
    CONFLICT = 9;       // ResolveShard
    NEEDS_PASSWORD = 10; // ShardPassword
    WAITING_UNLOCK = 11; // a merge needs the vault unlocked here
    ERROR = 12;         // message
  }
  Status status = 1;
  bool enabled = 2;
  // Shard answers here (status is not OFF/NOT_RUNNING), so the switch
  // can be shown; with no_vault false it can be turned on.
  bool available = 3;
  string pairing_code = 4; // "123 456"
  string message = 5;      // what went wrong, or what the user should do
  int64 synced_ms = 6;     // last successful sync
  string device_name = 7;  // Shard's name for this device
  // CONFLICT: merging is possible (the same vault on both sides).
  bool can_merge = 8;
  // The pairing was revoked or denied: sync went off, offer to pair again.
  bool unpaired = 9;
  // The platform can open Shard (Android): offer it for LOCKED/PAIRING.
  bool can_open = 10;
}

message ResolveShardRequest {
  enum Choice {
    CHOICE_UNSPECIFIED = 0;
    USE_SYNCED = 1; // the synced vault replaces this one (a backup stays)
    UPLOAD = 2;     // this vault replaces the synced one
    MERGE = 3;      // accounts of both (can_merge)
  }
  Choice choice = 1;
}

message DisableShardRequest {
  bool remove_synced = 1; // also delete the synced copy from Shard
}

// What a provider can do. Only MESSAGES exists today; the others are
// reserved so the app and the core agree on them when they arrive.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_MESSAGES = 1;
  CAPABILITY_CALLS = 2;       // 1:1 audio/video calls
  CAPABILITY_GROUP_CALLS = 3; // conferences
  CAPABILITY_MAIL = 4;
  CAPABILITY_CALENDAR = 5;
  // Sessions: Account.capabilities tells what an account's session does.
  CAPABILITY_THREADS = 6;   // Thread, SendRequest.thread_id
  CAPABILITY_REACTIONS = 7; // React
  CAPABILITY_MEDIA = 8;     // Media
  CAPABILITY_TOPICS = 9;    // Topics, MarkReadRequest.thread_id
  CAPABILITY_FORWARD = 10;  // Forward inside the account (others: send the text)
  CAPABILITY_FILES = 11;    // SendRequest.files
  CAPABILITY_PROFILES = 12; // Profile
  CAPABILITY_EDIT = 13;     // Edit the account's own messages
  CAPABILITY_DELETE = 14;   // Delete the account's own messages for everyone
  CAPABILITY_DELETE_FOR_ME = 15; // Delete with for_all false
  CAPABILITY_MENTIONS = 16; // Members, SendRequest.mentions
  CAPABILITY_CHAT_FOLDERS = 17; // ChatFolders, Chat.folders
  CAPABILITY_MANAGE_CHATS = 18; // ManageChat with Account.chat_actions
}

// Something the account does to one of its chats (ManageChat).
enum ChatAction {
  CHAT_ACTION_UNSPECIFIED = 0;
  CHAT_ACTION_MUTE = 1;
  CHAT_ACTION_UNMUTE = 2;
  CHAT_ACTION_PIN = 3;
  CHAT_ACTION_UNPIN = 4;
  CHAT_ACTION_ARCHIVE = 5;
  CHAT_ACTION_UNARCHIVE = 6;
  CHAT_ACTION_LEAVE = 7; // groups and channels; the chat is removed
}

message Field {
  string key = 1;
  string label = 2;
  string help = 3;
  bool secret = 4;   // password, token: mask it
  bool optional = 5;
  string default_value = 6;
  bool multiline = 7;
}

message AuthMethod {
  string id = 1;
  string name = 2;
  string description = 3;
}

message ProviderInfo {
  string type = 1; // "telegram", "slack", "vkteams"
  string name = 2;
  repeated AuthMethod auth_methods = 3;
  repeated Capability capabilities = 4;
}

message ProvidersReply { repeated ProviderInfo providers = 1; }

message StartLoginRequest {
  string provider = 1;
  string method = 2; // AuthMethod.id; empty: the first one
}

message LoginStepRequest {
  string login_id = 1;
  map<string, string> values = 2; // Field.key -> value
}

message LoginStepReply {
  string login_id = 1;
  string title = 2;
  string message = 3;    // explanation for this step
  string error = 4;      // the previous answer was rejected (wrong code, ...)
  repeated Field fields = 5;
  // Open this URL in a browser on this device (OAuth); the step may finish
  // by itself (wait with LoginStep and no values) or ask for the result.
  string open_url = 6;
  bool done = 7;
  Account account = 8; // set when done
  // Show this text as a QR code to scan with another device (Telegram:
  // Settings → Devices → Link Desktop Device). Wait like for open_url; the
  // code changes every ~30 s, each reply carries the current one.
  string qr = 9;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_DISABLED = 1;
  ACCOUNT_STATUS_CONNECTING = 2;
  ACCOUNT_STATUS_ONLINE = 3;
  ACCOUNT_STATUS_OFFLINE = 4;      // network trouble, retrying
  ACCOUNT_STATUS_NEEDS_LOGIN = 5;  // session revoked or expired: Relogin
}

message Account {
  string id = 1;
  string provider = 2;
  string name = 3;    // shown to the user; editable
  string login = 4;   // who it signs in as: phone, e-mail, workspace/user
  AccountStatus status = 5;
  string status_message = 6;
  bool enabled = 7;
  User self = 8;
  int32 unread = 9;
  repeated Capability capabilities = 10;
  int32 mail_unread = 11; // unread in the inbox (CAPABILITY_MAIL)
  repeated ChatAction chat_actions = 12; // what ManageChat does here
}

message AccountsReply { repeated Account accounts = 1; }

message ReorderAccountsRequest { repeated string ids = 1; }

message RenameRequest {
  string id = 1;
  string name = 2;
}

message SetEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

message User {
  string id = 1;
  string name = 2;
  string username = 3;
  string avatar_url = 4; // a media ref (Media), not a URL to open
  bool online = 5;       // set only in MembersReply: live, never stored
}

enum ChatKind {
  CHAT_KIND_UNSPECIFIED = 0;
  CHAT_KIND_DIRECT = 1;
  CHAT_KIND_GROUP = 2;
  CHAT_KIND_CHANNEL = 3;
}

message Chat {
  string account_id = 1;
  string id = 2;
  ChatKind kind = 3;
  string title = 4;
  string avatar_url = 5; // a media ref (Media)
  int32 unread = 6;
  bool muted = 7;
  Message last_message = 8;
  int64 updated_ms = 9; // last activity
  bool pinned = 10;
  // The account can only read this chat (someone's broadcast channel,
  // writing banned): no composer.
  bool read_only = 11;
  // A forum: the chat is split into topics (Topics).
  bool forum = 12;
  // A direct chat whose other person is online now (live, not cached;
  // a change comes as KIND_CHAT).
  bool online = 13;
  // The account's own notes (Telegram's Saved Messages, the chat with
  // oneself): the app names it.
  bool saved = 14;
  // In the messenger's archive: listed apart from the other chats.
  bool archived = 15;
  // Ids of the account's chat folders the chat is in by their rules
  // (see ChatFolder).
  repeated string folders = 16;
}

message ManageChatRequest {
  string account_id = 1;
  string chat_id = 2;
  ChatAction action = 3;
}

// A folder of an account's chat list. A chat of the account is in it when
// its id is in always, or Chat.folders names the folder and no exclude_*
// applies to it.
message ChatFolder {
  string account_id = 1;
  string id = 2;
  string title = 3;
  string emoji = 4;
  repeated string always = 5;
  repeated string pinned = 6; // first, in this order
  bool exclude_muted = 7;
  bool exclude_read = 8;
  bool exclude_archived = 9;
}

message ChatFoldersReply {
  repeated ChatFolder folders = 1; // per account in its order
  repeated AccountError failed = 2;
}

message ChatsRequest {
  repeated string account_ids = 1;
  int32 limit = 2; // 0: all
}

message ChatsReply { repeated Chat chats = 1; }

enum AttachmentKind {
  ATTACHMENT_KIND_UNSPECIFIED = 0;
  ATTACHMENT_KIND_FILE = 1;
  ATTACHMENT_KIND_IMAGE = 2;
  ATTACHMENT_KIND_VIDEO = 3;
  ATTACHMENT_KIND_AUDIO = 4;
  ATTACHMENT_KIND_VOICE = 5;
  ATTACHMENT_KIND_STICKER = 6;
}

message Attachment {
  AttachmentKind kind = 1;
  string name = 2;
  string mime = 3;
  int64 size = 4;
  string ref = 5;   // media ref of the file (Media); empty: not downloadable
  string thumb = 6; // media ref of a small preview image
  int32 width = 7;  // pixels, 0: unknown
  int32 height = 8;
  int32 duration_ms = 9;
}

message Reaction {
  // The emoji, or ":name:" for a custom one the app cannot draw.
  string emoji = 1;
  int32 count = 2;
  bool mine = 3;
}

message Thread {
  string id = 1; // ThreadRequest.thread_id
  int32 replies = 2;
  int64 last_ms = 3;
  repeated User users = 4; // latest repliers
}

message Message {
  string account_id = 1;
  string chat_id = 2;
  string id = 3;
  User sender = 4;
  string text = 5;
  int64 time_ms = 6;
  int64 edited_ms = 7;
  bool outgoing = 8;
  string reply_to_id = 9;
  repeated Attachment attachments = 10;
  bool deleted = 11;
  // Service message (joined, title changed, call): shown centred.
  bool service = 12;
  repeated Reaction reactions = 13;
  Thread thread = 14;     // a discussion hangs under this message
  string in_thread = 15;  // a reply inside the thread with this id
  // Messages sent together as one album share it (Telegram's grouped_id);
  // neighbours with the same group are shown as one message.
  string group = 16;
  // The message mentions this account's user (or replies to them, in
  // Telegram): muted chats still notify about it.
  bool mentioned = 17;
  // A forwarded message: who wrote the original (a name; may be empty
  // when the messenger hides it, then forwarded is still set).
  bool forwarded = 18;
  string forwarded_from = 19;
  // A reply that quotes a fragment of reply_to_id's text (Telegram).
  string quote = 20;
  // Styles of text, which holds no markup itself.
  repeated TextSpan format = 21;
  // The text as Markdown for the composer when it differs from text (the
  // account's own messages only).
  string markdown = 22;
}

enum TextStyle {
  TEXT_STYLE_UNSPECIFIED = 0;
  TEXT_STYLE_BOLD = 1;
  TEXT_STYLE_ITALIC = 2;
  TEXT_STYLE_UNDERLINE = 3;
  TEXT_STYLE_STRIKE = 4;
  TEXT_STYLE_SPOILER = 5;
  TEXT_STYLE_CODE = 6;
  TEXT_STYLE_PRE = 7;
  TEXT_STYLE_LINK = 8;
  TEXT_STYLE_QUOTE = 9;
  TEXT_STYLE_HEADING = 10;
}

// A styled part of a text, in UTF-16 units. Spans may nest and overlap.
message TextSpan {
  TextStyle style = 1;
  int32 offset = 2;
  int32 length = 3;
  string url = 4;      // TEXT_STYLE_LINK: http(s) or mailto
  string language = 5; // TEXT_STYLE_PRE
}

message ThreadRequest {
  string account_id = 1;
  string chat_id = 2;
  string thread_id = 3;
  string before_id = 4;
  int32 limit = 5;
}

message TopicsRequest {
  string account_id = 1;
  string chat_id = 2;
}

message Topic {
  string id = 1;  // ThreadRequest.thread_id, SendRequest.thread_id
  string title = 2;
  int32 unread = 3;
  int32 color = 4; // icon colour 0xRRGGBB; 0: none
  bool pinned = 5;
  bool closed = 6; // only admins may write
  bool hidden = 7; // the general topic, collapsed
  Message last_message = 8;
  int64 updated_ms = 9;
}

message TopicsReply { repeated Topic topics = 1; }

message ReactRequest {
  string account_id = 1;
  string chat_id = 2;
  string message_id = 3;
  string emoji = 4;
  bool on = 5; // false: take the reaction back
}

message EditRequest {
  string account_id = 1;
  string chat_id = 2;
  string message_id = 3;
  string text = 4;
  string thread_id = 5; // a thread reply: the thread it is in
}

message DeleteRequest {
  string account_id = 1;
  string chat_id = 2;
  repeated string message_ids = 3;
  bool for_all = 4;
  string thread_id = 5; // thread replies: the thread they are in
}

// A span of SendRequest.text naming a person; offsets in UTF-16 code units.
message Mention {
  int32 offset = 1;
  int32 length = 2;
  User user = 3;
}

message MembersRequest {
  string account_id = 1;
  string chat_id = 2;
  string query = 3; // typed after "@"
  int32 limit = 4;
}

message MembersReply { repeated User users = 1; }

message LinkPreviewRequest { string url = 1; }

message LinkPreviewReply {
  string url = 1; // after redirects
  string site_name = 2;
  string title = 3;
  string description = 4;
  bytes image = 5; // empty: none
  string image_mime = 6;
}

message ProfileRequest {
  string account_id = 1;
  string chat_id = 2;
}

message ChatProfile {
  string title = 1;
  string avatar_url = 2; // a media ref (Media)
  string username = 3;   // without "@"
  string about = 4;      // bio, description, purpose
  string phone = 5;
  string email = 6;
  string position = 7;   // job title, status
  string link = 8;       // a public link to open
  int32 members = 9;     // groups, channels; 0: unknown
  repeated User member_list = 10; // some members, may be partial
  int64 last_seen_ms = 11;        // direct: last online; 0: unknown
  bool online = 12;
  bool bot = 13;
}

message MediaRequest {
  string account_id = 1;
  string ref = 2;
  // Larger files fail with RESOURCE_EXHAUSTED; 0: the core's default (32 MB).
  int64 max_bytes = 3;
  // Only fetch it into the core's cache; the reply carries no data.
  bool prefetch = 4;
}

message MediaReply {
  bytes data = 1;
  string mime = 2;
}

message HistoryRequest {
  string account_id = 1;
  string chat_id = 2;
  string before_id = 3;
  int32 limit = 4;
  // Only what the cache has, at once, possibly with gaps (no network): to
  // show while the real page loads. before_id is ignored.
  bool cached_only = 5;
}

message HistoryReply {
  repeated Message messages = 1;
  bool more = 2; // older messages may exist
}

message SendRequest {
  string account_id = 1;
  string chat_id = 2;
  string text = 3;
  string reply_to_id = 4;
  string thread_id = 5; // send into this thread
  // A fragment of reply_to_id's text this reply quotes: a native quote
  // where the messenger has one, otherwise "> " lines before the text.
  string quote = 6;
  // Files to send (CAPABILITY_FILES), the text being their caption; at
  // most 100 MB together. Several files may become several messages (an
  // album): the reply is the last one, the others come as events. The
  // reply has an empty id when the messenger does not echo what was sent
  // (it comes as an event then).
  repeated OutFile files = 7;
  // People picked after "@" (CAPABILITY_MENTIONS): spans of text the
  // messenger turns into its mentions.
  repeated Mention mentions = 8;
}

message OutFile {
  string name = 1;
  string mime = 2; // empty: guessed from the name and the content
  bytes data = 3;
}

// Forwards messages of one chat to another chat of the same account
// (CAPABILITY_FORWARD), attachments and the "forwarded" mark included.
message ForwardRequest {
  string account_id = 1;
  string chat_id = 2;
  repeated string message_ids = 3; // oldest first
  string to_chat_id = 4;
}

message ForwardReply {
  repeated Message messages = 1; // what appeared in to_chat_id
}

message MarkReadRequest {
  string account_id = 1;
  string chat_id = 2;
  string message_id = 3; // read up to this one; empty: the latest
  string thread_id = 4;  // a topic of a forum chat (CAPABILITY_TOPICS)
}

message Event {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_STATE = 1;          // vault state changed: GetState
    KIND_ACCOUNT = 2;        // account added/changed/removed (account set; removed: only id)
    KIND_CHAT = 3;           // chat changed (title, unread, last message)
    KIND_MESSAGE_NEW = 4;
    KIND_MESSAGE_EDIT = 5;
    KIND_MESSAGE_DELETE = 6; // message carries account, chat and id only
    KIND_TYPING = 7;         // message.sender is typing in message.chat_id
    KIND_CHAT_REMOVED = 8;   // chat carries account and id only
    KIND_THREAD_MESSAGE = 9; // message (new or edited) inside thread message.in_thread
                           // (chat: the cached chat, when there is one)
    KIND_CALL = 10;          // call offered, changed or ended
    KIND_CALL_SIGNAL = 11;   // signal for the peer connection of call (ids only in call)
    KIND_CHAT_FOLDERS = 12;  // account_id's chat folders changed: ChatFolders
    KIND_MAIL_NEW = 20;      // mail is a new message in account_id's inbox
    KIND_MAIL = 21;          // account_id's mail changed: reload what is shown
    KIND_CALENDAR = 22;      // account_id's events changed: reload the range
    KIND_SHARD = 23;     // Shard sync state changed: GetState / Shard
  }
  Kind kind = 1;
  Account account = 2;
  Chat chat = 3;
  Message message = 4;
  string account_id = 5;
  Call call = 6;
  CallSignal signal = 7;
  Mail mail = 8; // KIND_MAIL_NEW: summary only
  // KIND_MESSAGE_NEW / KIND_THREAD_MESSAGE worth a notification: from
  // someone else, in a chat that is not muted or mentioning the user
  // (in a thread: only a mention, once). The app adds whether it is seen.
  bool notify = 9;
}

message LogsRequest {
  string account_id = 1; // empty: all
  int32 limit = 2;
}

message LogEntry {
  uint64 seq = 1;
  int64 time_ms = 2;
  int64 first_ms = 3;
  string level = 4;
  string source = 5;
  string account_id = 6;
  string message = 7;
  int32 count = 8;
}

message LogsReply { repeated LogEntry entries = 1; }

enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_WAITING = 1;    // outgoing, the peer's device does not ring yet
  CALL_STATE_RINGING = 2;    // outgoing: rings there; incoming: waiting for the user
  CALL_STATE_CONNECTING = 3; // answered, media connecting
  CALL_STATE_ACTIVE = 4;
  CALL_STATE_ENDED = 5;
}

enum CallEnd {
  CALL_END_UNSPECIFIED = 0;
  CALL_END_HANGUP = 1;
  CALL_END_DECLINED = 2;
  CALL_END_MISSED = 3;
  CALL_END_BUSY = 4;
  CALL_END_FAILED = 5; // Call.error says why
}

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message CallMedia {
  bool muted = 1;
  bool video = 2;  // camera on
  bool screen = 3; // sharing the screen
}

message Call {
  string account_id = 1;
  string id = 2;
  string chat_id = 3;
  User peer = 4;
  bool outgoing = 5;
  bool video = 6; // started as a video call
  CallState state = 7;
  CallEnd end = 8;
  string error = 9;
  int64 started_ms = 10; // became active
  repeated string verification = 11; // emoji of the end-to-end key
  repeated IceServer ice = 12;
  bool relay_only = 13;
  // Perfect negotiation: polite peers roll back their offer on a collision.
  bool polite = 14;
  string channel = 15;      // data channel label (empty: none)
  bool open_channel = 16;   // this side creates it before its first offer
  bool offer = 17;          // this side sends the first offer
  CallMedia remote = 18;
}

enum SignalKind {
  SIGNAL_KIND_UNSPECIFIED = 0;
  SIGNAL_KIND_OFFER = 1;
  SIGNAL_KIND_ANSWER = 2;
  SIGNAL_KIND_CANDIDATE = 3; // empty sdp: end of candidates
  SIGNAL_KIND_DATA = 4;      // text on the data channel
  SIGNAL_KIND_CONNECTED = 5; // app to core: media flows
  SIGNAL_KIND_FAILED = 6;    // app to core: cannot connect (data: why)
}

message CallSignal {
  SignalKind kind = 1;
  string sdp = 2;
  string mid = 3;
  int32 mline = 4;
  string data = 5;
  int64 seq = 6; // core to app: per call, from 1
}

message StartCallRequest {
  string account_id = 1;
  string chat_id = 2;
  bool video = 3;
}

message CallRequest {
  string account_id = 1;
  string call_id = 2;
  bool video = 3;
}

message EndCallRequest {
  string account_id = 1;
  string call_id = 2;
  CallEnd reason = 3; // HANGUP (also cancels) or DECLINED
}

message CallSignalRequest {
  string account_id = 1;
  string call_id = 2;
  CallSignal signal = 3;
}

message CallMediaRequest {
  string account_id = 1;
  string call_id = 2;
  CallMedia media = 3;
}

message CallsReply {
  repeated Call calls = 1;
}

message CallSignalsRequest {
  string account_id = 1;
  string call_id = 2;
  int64 after = 3;
}

message CallSignalsReply {
  repeated CallSignal signals = 1;
}

// --- mail -----------------------------------------------------------------

message AccountsRequest {
  repeated string account_ids = 1; // empty: all accounts with the capability
}

// A failed part of a merged read.
message AccountError {
  string account_id = 1;
  string error = 2;
}

enum FolderRole {
  FOLDER_ROLE_OTHER = 0; // a user's folder or label
  FOLDER_ROLE_INBOX = 1;
  FOLDER_ROLE_SENT = 2;
  FOLDER_ROLE_DRAFTS = 3;
  FOLDER_ROLE_TRASH = 4;
  FOLDER_ROLE_SPAM = 5;
  FOLDER_ROLE_ARCHIVE = 6; // Gmail's All mail, IMAP \Archive
}

message Folder {
  string account_id = 1;
  string id = 2;
  string name = 3;
  FolderRole role = 4;
  int32 unread = 5;
  int32 total = 6;
}

message FoldersReply {
  repeated Folder folders = 1;
  repeated AccountError failed = 2;
}

message Address {
  string name = 1;
  string email = 2;
}

message Mail {
  string account_id = 1;
  string id = 2;
  string folder_id = 3;
  string thread_id = 4;
  Address from = 5;
  repeated Address to = 6;
  repeated Address cc = 7;
  repeated Address reply_to = 8;
  string subject = 9;
  string snippet = 10;
  int64 time_ms = 11;
  bool unread = 12;
  bool starred = 13;
  bool has_attachments = 14;
  // GetMail only. text is the visible text (of the HTML part when there is
  // one) and format its styles; html is the original HTML part, if any.
  // Remote content in it is not loaded by the core.
  string text = 15;
  string html = 16;
  repeated Attachment attachments = 17;
  repeated TextSpan format = 18;
}

message MailListRequest {
  repeated string account_ids = 1; // empty: every mail account
  // The folder of each account with this role (all inboxes); or, with
  // exactly one account, the folder folder_id.
  FolderRole role = 2;
  string folder_id = 3;
  string cursor = 4; // MailListReply.next; empty: the latest
  int32 limit = 5;
}

message MailListReply {
  repeated Mail mails = 1;
  bool more = 2;
  string next = 3; // cursor of the next page
  repeated AccountError failed = 4;
}

message GetMailRequest {
  string account_id = 1;
  string id = 2;
}

message SendMailRequest {
  string account_id = 1;
  repeated Address to = 2;
  repeated Address cc = 3;
  repeated Address bcc = 4;
  string subject = 5;
  string text = 6;
  string reply_to_id = 7; // the message this one answers
}

enum MailAction {
  MAIL_ACTION_UNSPECIFIED = 0;
  MAIL_ACTION_READ = 1;
  MAIL_ACTION_UNREAD = 2;
  MAIL_ACTION_STAR = 3;
  MAIL_ACTION_UNSTAR = 4;
  MAIL_ACTION_TRASH = 5;
}

message UpdateMailRequest {
  string account_id = 1;
  repeated string ids = 2;
  MailAction action = 3;
}

message MoveMailRequest {
  string account_id = 1;
  repeated string ids = 2;   // listed in from_folder_id (Mail.folder_id)
  string from_folder_id = 3;
  string to_folder_id = 4;
}

// --- calendars ------------------------------------------------------------

message Calendar {
  string account_id = 1;
  string id = 2;
  string name = 3;
  int32 color = 4; // 0xRRGGBB; 0: none
  bool read_only = 5;
  bool primary = 6;
}

message CalendarsReply {
  repeated Calendar calendars = 1;
  repeated AccountError failed = 2;
}

enum Rsvp {
  RSVP_UNSPECIFIED = 0;
  RSVP_NEEDS_ACTION = 1;
  RSVP_ACCEPTED = 2;
  RSVP_TENTATIVE = 3;
  RSVP_DECLINED = 4;
}

message Attendee {
  Address address = 1;
  Rsvp status = 2;
  bool self = 3;
}

message CalendarEvent {
  string account_id = 1;
  string calendar_id = 2;
  string id = 3; // empty in SaveEvent: a new event
  string title = 4;
  string location = 5;
  string description = 6;
  // End is exclusive. All-day events: midnights UTC of their dates.
  int64 start_ms = 7;
  int64 end_ms = 8;
  bool all_day = 9;
  bool recurring = 10; // an occurrence of a repeating event
  Address organizer = 11;
  repeated Attendee attendees = 12;
  string link = 13; // event page or video meeting
  // The repeating event's rule: an RFC 5545 RRULE value without "RRULE:"
  // ("FREQ=WEEKLY;BYDAY=MO"); empty: it does not repeat. Occurrences carry
  // their series' rule. In SaveEvent it sets the rule of a new event, of an
  // event that did not repeat, of the new series (scope FOLLOWING; the old
  // rule goes on with what was left of a COUNT), or of the series (scope
  // ALL); empty keeps the series' rule.
  string recurrence = 14;
  // SaveEvent only: what of a repeating event an occurrence's change touches.
  RecurrenceScope scope = 15;
}

// What of a repeating event a change or a delete of one occurrence touches.
enum RecurrenceScope {
  RECURRENCE_SCOPE_THIS = 0;      // this occurrence only
  RECURRENCE_SCOPE_FOLLOWING = 1; // this and the following ones
  RECURRENCE_SCOPE_ALL = 2;       // the whole series
}

message CalendarRef {
  string account_id = 1;
  string calendar_id = 2;
}

message EventsRequest {
  repeated string account_ids = 1;   // empty: every calendar account
  repeated CalendarRef calendars = 2; // empty: all calendars
  int64 from_ms = 3;
  int64 to_ms = 4;
}

message EventsReply {
  repeated CalendarEvent events = 1;
  repeated AccountError failed = 2;
}

message DeleteEventRequest {
  string account_id = 1;
  string calendar_id = 2;
  string id = 3;
  RecurrenceScope scope = 4; // for an occurrence of a repeating event
}
