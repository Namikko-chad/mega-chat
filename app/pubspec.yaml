name: parley
description: Parley — one client for VK Teams, Slack and Telegram, several accounts each.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  grpc: ^5.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  ffi: ^2.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  qr_flutter: ^4.1.0
  open_filex: ^4.7.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_webrtc: ^1.6.3
  file_selector: ^1.1.0

# media_kit_video's wakelock_plus pulls in win32; see packages/wakelock_plus.
dependency_overrides:
  wakelock_plus:
    path: packages/wakelock_plus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/icon/
    - assets/sounds/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
