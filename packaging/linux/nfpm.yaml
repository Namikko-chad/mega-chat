# Linux packages (deb, rpm, archlinux) for Parley. Built by `make package-linux`
# from the output of make build-linux (bundle in builds/linux); paths are relative to the repo root.
# The Flutter bundle is relocatable and finds its data next to the binary, so it
# stays together under /opt/selfhold/parley. Icon and menu caches are refreshed by the
# package managers' own hooks (pacman hooks, dpkg and rpm file triggers).
name: parley
arch: amd64
platform: linux
version: ${PKG_VERSION}
release: 1
section: net
priority: optional
maintainer: SelfHold <https://github.com/SelfHold>
vendor: SelfHold
homepage: https://github.com/SelfHold/parley
license: GPL-3.0-or-later
description: |-
  One client for VK Teams, Slack and Telegram, plus mail and calendars,
  several accounts per provider.

contents:
  - src: builds/linux
    dst: /opt/selfhold/parley
    type: tree
  - src: /opt/selfhold/parley/parley
    dst: /usr/bin/parley
    type: symlink
  - src: packaging/linux/dev.selfhold.parley.desktop
    dst: /usr/share/applications/dev.selfhold.parley.desktop
    file_info: { mode: 0644 }
  - src: branding/parley_icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.selfhold.parley.svg
    file_info: { mode: 0644 }
  - src: app/assets/icon/parley.png
    dst: /usr/share/icons/hicolor/256x256/apps/dev.selfhold.parley.png
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/parley/LICENSE
    packager: archlinux
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/parley/copyright
    packager: deb
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/parley/LICENSE
    type: license
    packager: rpm
    file_info: { mode: 0644 }

# Library names differ per distribution.
overrides:
  deb:
    depends:
      - "libgtk-3-0t64 | libgtk-3-0"
      - "libayatana-appindicator3-1"
      - "libmpv2"
    recommends:
      - "xdg-utils"
  rpm:
    depends:
      - "gtk3"
      - "libayatana-appindicator-gtk3"
      - "mpv-libs"
    recommends:
      - "xdg-utils"
  archlinux:
    depends:
      - "gtk3"
      - "libayatana-appindicator"
      - "mpv"
